target-version = "py310"
line-length = 100

[lint]
# Start with syntax and definite-runtime-error rules for the existing codebase.
# Broader cleanup remains visible to maintainers but does not block security fixes.
select = ["E9", "F63", "F7", "F82"]

[lint.per-file-ignores]
"tests/**/*.py" = ["F841"]
