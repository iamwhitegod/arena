name: Bug report
description: Report a reproducible Arena OSS problem
title: '[Bug]: '
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, cookies, private media, transcripts, or unredacted logs. Report security issues privately through SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal commands and inputs using non-sensitive sample data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Arena version
      placeholder: arena --version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Node.js, Python, FFmpeg, and installation method.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Paste only the relevant, reviewed output from arena diagnose.
