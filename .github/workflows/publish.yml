name: Publish to npm

on:
  release:
    types: [created]

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan release source for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require successful local inference verification for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/local-inference-smoke.yml/runs" \
            -f "head_sha=$GITHUB_SHA" \
            -f status=success \
            -f per_page=100 > /tmp/arena-local-inference-runs.json
          node <<'NODE'
          const runs = require('/tmp/arena-local-inference-runs.json').workflow_runs ?? [];
          const verified = runs.find((run) =>
            ['schedule', 'workflow_dispatch'].includes(run.event) && run.conclusion === 'success'
          );
          if (!verified) {
            throw new Error(
              `No successful local inference smoke run exists for ${process.env.GITHUB_SHA}`
            );
          }
          console.log(`Using local inference verification: ${verified.html_url}`);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements-dev.lock

      - name: Install Node dependencies
        working-directory: cli
        run: npm ci --ignore-scripts

      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes -r engine/requirements-dev.lock

      - name: Run TypeScript quality gates
        working-directory: cli
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run build

      - name: Run Python quality gates
        run: |
          ruff check --config engine/ruff.toml engine/arena engine/tests
          python -m pytest engine/tests -v --tb=short

      - name: Audit production dependencies
        run: |
          npm audit --prefix cli --omit=dev --audit-level=high
          python -m pip_audit --require-hashes -r engine/requirements.lock
          python -m pip_audit --require-hashes -r engine/requirements-local.lock

      - name: Build and inspect minimal package artifact
        working-directory: cli
        run: |
          npm run package:stage
          npm pack .package --dry-run
          mkdir -p release-artifacts
          npm pack .package --pack-destination release-artifacts

      - name: Generate CycloneDX SBOMs
        run: |
          npm sbom --prefix cli --omit=dev --sbom-format cyclonedx > cli/release-artifacts/arena-cli.cdx.json
          python -m pip_audit --require-hashes -r engine/requirements.lock --format cyclonedx-json --output cli/release-artifacts/arena-engine.cdx.json
          python -m pip_audit --require-hashes -r engine/requirements-local.lock --format cyclonedx-json --output cli/release-artifacts/arena-engine-local.cdx.json

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: cli/release-artifacts/*

      - name: Upload release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: arena-release-evidence
          path: cli/release-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish to npm
        working-directory: cli
        run: npm publish .package --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
