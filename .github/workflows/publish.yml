name: Publish to npm

on:
  release:
    types: [created]

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require successful security verification for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          evidence_file="$RUNNER_TEMP/arena-security-runs.json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/security.yml/runs" \
            -f "head_sha=$GITHUB_SHA" \
            -f status=success \
            -f per_page=100 > "$evidence_file"
          node .github/scripts/require-successful-workflow.cjs \
            "$evidence_file" "$GITHUB_SHA" "$DEFAULT_BRANCH" "Security"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Verify release version and npm tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          package_version="$(node --print "require('./cli/package.json').version")"
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Release tag $RELEASE_TAG must exactly match CLI version v$package_version." >&2
            exit 1
          fi
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            npm_tag="next"
          else
            npm_tag="latest"
          fi
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-dev.lock

      - name: Install Node dependencies
        working-directory: cli
        run: npm ci --ignore-scripts

      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes -r engine/requirements-dev.lock

      - name: Run TypeScript quality gates
        working-directory: cli
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run build

      - name: Run Python quality gates
        run: |
          ruff check --config engine/ruff.toml engine/arena engine/tests
          python -m pytest engine/tests -v --tb=short

      - name: Audit production dependencies
        run: |
          npm audit --prefix cli --omit=dev --audit-level=high
          python -m pip_audit --require-hashes -r engine/requirements.lock

      - name: Build and inspect minimal package artifact
        working-directory: cli
        run: |
          npm run package:stage
          npm pack .package --dry-run
          mkdir -p release-artifacts
          npm pack .package --pack-destination release-artifacts

      - name: Generate CycloneDX SBOMs
        run: |
          npm sbom --prefix cli --omit=dev --sbom-format cyclonedx > cli/release-artifacts/arena-cli.cdx.json
          python -m pip_audit --require-hashes -r engine/requirements.lock --format cyclonedx-json --output cli/release-artifacts/arena-engine.cdx.json

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: cli/release-artifacts/*

      - name: Upload release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: arena-release-evidence
          path: cli/release-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish to npm
        working-directory: cli
        run: npm publish .package --provenance --access public --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
