name: Publish to npm

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan release source for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements-dev.lock

      - name: Install Node dependencies
        working-directory: cli
        run: npm ci --ignore-scripts

      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes -r engine/requirements-dev.lock

      - name: Run TypeScript quality gates
        working-directory: cli
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run build

      - name: Run Python quality gates
        run: |
          ruff check --config engine/ruff.toml engine/arena engine/tests
          python -m pytest engine/tests -v --tb=short

      - name: Audit production dependencies
        run: |
          npm audit --prefix cli --omit=dev --audit-level=high
          python -m pip_audit --require-hashes -r engine/requirements.lock

      - name: Build and inspect minimal package artifact
        working-directory: cli
        run: |
          npm run package:stage
          npm pack .package --dry-run
          mkdir -p release-artifacts
          npm pack .package --pack-destination release-artifacts

      - name: Generate CycloneDX SBOMs
        run: |
          npm sbom --prefix cli --omit=dev --sbom-format cyclonedx > cli/release-artifacts/arena-cli.cdx.json
          python -m pip_audit --require-hashes -r engine/requirements.lock --format cyclonedx-json --output cli/release-artifacts/arena-engine.cdx.json

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: cli/release-artifacts/*

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arena-release-evidence
          path: cli/release-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish to npm
        working-directory: cli
        run: npm publish .package --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
