name: Install smoke

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact:
    name: Build exact npm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install build dependencies
        working-directory: cli
        run: npm ci --ignore-scripts

      - name: Stage, verify, and pack artifact
        working-directory: cli
        run: npm run package:artifact -- --output "${{ runner.temp }}/arena-install-artifact"

      - name: Retain exact tarball and inventory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: arena-install-artifact
          path: ${{ runner.temp }}/arena-install-artifact
          if-no-files-found: error
          retention-days: 14

  consumer:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    needs: artifact
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download exact npm artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: arena-install-artifact
          path: ${{ runner.temp }}/arena-install-artifact

      - name: Install and start as an isolated consumer
        run: >-
          node cli/scripts/consumer-install-smoke.cjs
          --tarball "${{ runner.temp }}/arena-install-artifact"
          --evidence "${{ runner.temp }}/arena-install-evidence.json"

      - name: Retain consumer evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: install-evidence-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/arena-install-evidence.json
          if-no-files-found: error
          retention-days: 14
