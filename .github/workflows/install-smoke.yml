name: Install smoke

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact:
    name: Build exact npm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install build dependencies
        working-directory: cli
        run: npm ci --ignore-scripts

      - name: Stage, verify, and pack artifact
        working-directory: cli
        run: npm run package:artifact -- --output "${{ runner.temp }}/arena-install-artifact"

      - name: Retain exact tarball and inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arena-install-artifact
          path: ${{ runner.temp }}/arena-install-artifact
          if-no-files-found: error
          retention-days: 14

  consumer:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    needs: artifact
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download exact npm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arena-install-artifact
          path: ${{ runner.temp }}/arena-install-artifact

      - name: Install and start as an isolated consumer
        run: >-
          node cli/scripts/consumer-install-smoke.cjs
          --tarball "${{ runner.temp }}/arena-install-artifact"
          --evidence "${{ runner.temp }}/arena-install-evidence.json"

      - name: Retain consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-evidence-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/arena-install-evidence.json
          if-no-files-found: error
          retention-days: 14
