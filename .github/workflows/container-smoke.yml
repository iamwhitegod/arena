name: Container smoke

on:
  push:
    branches: [main, develop]
    paths:
      - Dockerfile
      - docker-compose.yml
      - .dockerignore
      - cli/package.json
      - cli/package-lock.json
      - cli/src/**
      - engine/**
      - .github/workflows/container-smoke.yml
      - .github/workflows/publish-container.yml
  pull_request:
    branches: [main, develop]
    paths:
      - Dockerfile
      - docker-compose.yml
      - .dockerignore
      - cli/package.json
      - cli/package-lock.json
      - cli/src/**
      - engine/**
      - .github/workflows/container-smoke.yml
      - .github/workflows/publish-container.yml
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            tag: arena:local
            compose: true
          - platform: linux/arm64
            architecture: arm64
            tag: arena:smoke-arm64
            compose: false

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build exact platform image
        run: >-
          docker buildx build
          --platform "${{ matrix.platform }}"
          --tag "${{ matrix.tag }}"
          --load
          .

      - name: Verify hardened runtime
        run: |
          set -o pipefail
          mkdir -p "${{ runner.temp }}/container-evidence"
          docker image inspect "${{ matrix.tag }}" > "${{ runner.temp }}/container-evidence/image-inspect.json"
          test "$(docker image inspect --format '{{.Architecture}}' "${{ matrix.tag }}")" = "${{ matrix.architecture }}"
          test "$(docker image inspect --format '{{.Config.User}}' "${{ matrix.tag }}")" = "node"
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=2g \
            --tmpfs /workspace:rw,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=0755 \
            --tmpfs /home/node/.arena:rw,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=0700 \
            --entrypoint sh \
            "${{ matrix.tag }}" \
            -c 'set -eu
            test "$(id -u)" != 0
            arena --version
            python --version
            ffmpeg -version
            ffprobe -version
            python -c "import PIL, arena, yt_dlp"
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x240:rate=24:duration=3 -f lavfi -i sine=frequency=1000:sample_rate=16000:duration=3 -c:v mpeg4 -q:v 8 -c:a aac -shortest /workspace/fixture.mp4
            arena extract-audio /workspace/fixture.mp4 --output /workspace/audio.wav --format wav
            arena detect-scenes /workspace/fixture.mp4 --output /workspace/scenes.json --threshold 0.15 --min-duration 0.2
            test -s /workspace/audio.wav
            test -s /workspace/scenes.json' 2>&1 | tee "${{ runner.temp }}/container-evidence/runtime-smoke.log"

      - name: Verify Compose configuration and startup
        if: matrix.compose
        env:
          ARENA_WORKSPACE: ${{ runner.temp }}/arena-compose-workspace
        run: |
          set -o pipefail
          mkdir -p "$ARENA_WORKSPACE"
          docker compose config --quiet
          docker compose run --rm --no-deps -T arena --version 2>&1 | tee "${{ runner.temp }}/container-evidence/compose-smoke.log"

      - name: Scan platform image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml

      - name: Retain platform evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: container-evidence-${{ matrix.architecture }}
          path: ${{ runner.temp }}/container-evidence
          if-no-files-found: warn
          retention-days: 14
