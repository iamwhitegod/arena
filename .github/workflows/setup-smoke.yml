name: Managed runtime smoke

on:
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact:
    name: Build exact npm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install build dependencies
        working-directory: cli
        run: npm ci --ignore-scripts

      - name: Stage, verify, and pack artifact
        working-directory: cli
        run: npm run package:artifact -- --output "${{ runner.temp }}/arena-install-artifact"

      - name: Retain exact tarball and inventory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: arena-setup-artifact
          path: ${{ runner.temp }}/arena-install-artifact
          if-no-files-found: error
          retention-days: 14

  setup:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }} / Python ${{ matrix.python-version }}
    needs: artifact
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.x
            python-version: '3.10'
          - os: ubuntu-latest
            node-version: 24.x
            python-version: '3.12'
          - os: windows-latest
            node-version: 22.x
            python-version: '3.10'
          - os: windows-latest
            node-version: 24.x
            python-version: '3.12'
          - os: macos-latest
            node-version: 22.x
            python-version: '3.10'
          - os: macos-latest
            node-version: 24.x
            python-version: '3.12'

    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install FFmpeg on macOS when absent
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg

      - name: Install FFmpeg on Windows when absent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
          }

      - name: Download exact npm artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: arena-setup-artifact
          path: ${{ runner.temp }}/arena-install-artifact

      - name: Install, configure, and process local media
        env:
          ARENA_PYTHON: python
        run: >-
          node cli/scripts/consumer-install-smoke.cjs
          --tarball "${{ runner.temp }}/arena-install-artifact"
          --setup
          --expected-python "${{ matrix.python-version }}"
          --timeout-ms 1800000
          --evidence "${{ runner.temp }}/arena-setup-evidence.json"

      - name: Retain setup and local-processing evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: setup-evidence-${{ matrix.os }}-node-${{ matrix.node-version }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/arena-setup-evidence.json
          if-no-files-found: error
          retention-days: 14

  recovery:
    name: Failure rollback and repair / Linux
    needs: artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x

      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Download exact npm artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: arena-setup-artifact
          path: ${{ runner.temp }}/arena-install-artifact

      - name: Verify setup rollback, recovery, and repair
        env:
          ARENA_PYTHON: python
        run: >-
          node cli/scripts/consumer-install-smoke.cjs
          --tarball "${{ runner.temp }}/arena-install-artifact"
          --setup-recovery
          --expected-python "3.12"
          --timeout-ms 1800000
          --evidence "${{ runner.temp }}/arena-setup-recovery-evidence.json"

      - name: Retain setup recovery evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: setup-recovery-evidence-linux
          path: ${{ runner.temp }}/arena-setup-recovery-evidence.json
          if-no-files-found: error
          retention-days: 14
