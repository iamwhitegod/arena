name: Local inference smoke

on:
  schedule:
    - cron: '41 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-inference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-runtime:
    name: ${{ matrix.os }} / Python 3.12 / lite pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            engine/build-requirements.lock
            engine/requirements-local.lock

      - name: Install hash-locked native build tooling
        run: python -m pip install --require-hashes --no-build-isolation -r engine/build-requirements.lock

      - name: Install hash-locked local runtimes
        run: python -m pip install --require-hashes --no-build-isolation -r engine/requirements-local.lock

      - name: Install verified lite model pack
        env:
          ARENA_MODEL_ROOT: ${{ runner.temp }}/arena-models
          PYTHONPATH: engine
        run: python -c "import os; from pathlib import Path; from arena.models import MODEL_PACKS, ModelManager; ModelManager(Path(os.environ['ARENA_MODEL_ROOT'])).install_pack(MODEL_PACKS['lite'])"

      - name: Run real llama.cpp, embedding, faster-whisper, and Silero smoke tests
        env:
          ARENA_LOCAL_MODEL_PACK: lite
          ARENA_MODEL_ROOT: ${{ runner.temp }}/arena-models
          ARENA_RUN_LOCAL_INFERENCE_TESTS: '1'
          PYTHONPATH: engine
        run: python -m unittest engine.tests.integration.test_local_runtime_smoke -v
