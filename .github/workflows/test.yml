name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.x
            python-version: '3.10'
          - os: ubuntu-latest
            node-version: 22.x
            python-version: '3.12'
          - os: ubuntu-latest
            node-version: 24.x
            python-version: '3.10'
          - os: ubuntu-latest
            node-version: 24.x
            python-version: '3.12'
          - os: windows-latest
            node-version: 22.x
            python-version: '3.10'
          - os: windows-latest
            node-version: 24.x
            python-version: '3.12'
          - os: macos-latest
            node-version: 22.x
            python-version: '3.10'
          - os: macos-latest
            node-version: 24.x
            python-version: '3.12'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: engine/requirements-dev.lock

      - name: Install Node dependencies
        working-directory: cli
        run: npm ci --ignore-scripts

      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes -r engine/requirements-dev.lock

      - name: Check TypeScript formatting
        working-directory: cli
        run: npm run format:check

      - name: Lint TypeScript
        working-directory: cli
        run: npm run lint

      - name: Lint Python correctness
        run: ruff check --config engine/ruff.toml engine/arena engine/tests

      - name: Run TypeScript tests
        working-directory: cli
        run: npm test

      - name: Run Python tests
        run: python -m pytest engine/tests -v --tb=short

      - name: Build CLI
        working-directory: cli
        run: npm run build
