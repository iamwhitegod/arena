name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22.x, 24.x]
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: engine/requirements-dev.lock

      - name: Install Node dependencies
        working-directory: cli
        run: npm ci --ignore-scripts

      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes -r engine/requirements-dev.lock

      - name: Check TypeScript formatting
        working-directory: cli
        run: npm run format:check

      - name: Lint TypeScript
        working-directory: cli
        run: npm run lint

      - name: Lint Python correctness
        run: ruff check --config engine/ruff.toml engine/arena engine/tests

      - name: Run TypeScript tests
        working-directory: cli
        run: npm test

      - name: Run Python tests
        run: python -m pytest engine/tests -v --tb=short

      - name: Build CLI
        working-directory: cli
        run: npm run build
