name: Source install smoke

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-install-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-install:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.x
            python-version: "3.10"
          - os: ubuntu-latest
            node-version: 22.x
            python-version: "3.12"
          - os: ubuntu-latest
            node-version: 24.x
            python-version: "3.10"
          - os: ubuntu-latest
            node-version: 24.x
            python-version: "3.12"
          - os: windows-latest
            node-version: 22.x
            python-version: "3.10"
          - os: windows-latest
            node-version: 24.x
            python-version: "3.12"
          - os: macos-latest
            node-version: 22.x
            python-version: "3.10"
          - os: macos-latest
            node-version: 24.x
            python-version: "3.12"

    steps:
      - name: Checkout clean source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install FFmpeg on macOS when absent
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg

      - name: Install FFmpeg on Windows when absent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
          }

      - name: Install, link, configure, and process from source
        env:
          ARENA_PYTHON: python
        run: >-
          node cli/scripts/consumer-install-smoke.cjs
          --source-dir cli
          --expected-python "${{ matrix.python-version }}"
          --setup
          --timeout-ms 1800000
          --evidence "${{ runner.temp }}/arena-source-install-evidence.json"

      - name: Retain source installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-install-evidence-${{ matrix.os }}-node-${{ matrix.node-version }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/arena-source-install-evidence.json
          if-no-files-found: error
          retention-days: 14
