name: Published npm canary

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published Arena version to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: registry-smoke-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Verify registry signatures and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Verify exact released version
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(node --print "require('./cli/package.json').version")" = "$CANDIDATE_VERSION"

      - name: Verify npm registry signatures and provenance
        env:
          PACKAGE_SPEC: "@whitegodkingsley/arena-cli@${{ inputs.version }}"
        run: |
          set -euo pipefail
          evidence_dir="${{ runner.temp }}/arena-registry-provenance"
          consumer_dir="${{ runner.temp }}/arena-registry-signature-consumer"
          mkdir -p "$evidence_dir" "$consumer_dir"
          npm view "$PACKAGE_SPEC" --json > "$evidence_dir/package-metadata.json"
          cd "$consumer_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts "$PACKAGE_SPEC"
          npm_config_color=false npm audit signatures | tee "$evidence_dir/npm-audit-signatures.txt"
          grep -Eq '[1-9][0-9]* packages? (has a|have) verified attestations?' \
            "$evidence_dir/npm-audit-signatures.txt"

      - name: Retain registry provenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-provenance-${{ inputs.version }}
          path: ${{ runner.temp }}/arena-registry-provenance
          if-no-files-found: error
          retention-days: 30

  canary:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.x
            python-version: "3.10"
          - os: ubuntu-latest
            node-version: 22.x
            python-version: "3.12"
          - os: ubuntu-latest
            node-version: 24.x
            python-version: "3.10"
          - os: ubuntu-latest
            node-version: 24.x
            python-version: "3.12"
          - os: windows-latest
            node-version: 22.x
            python-version: "3.10"
          - os: windows-latest
            node-version: 24.x
            python-version: "3.12"
          - os: macos-latest
            node-version: 22.x
            python-version: "3.10"
          - os: macos-latest
            node-version: 24.x
            python-version: "3.12"

    steps:
      - name: Checkout released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install FFmpeg on macOS when absent
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg

      - name: Install FFmpeg on Windows when absent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
          }

      - name: Install exact registry package and process local media
        env:
          ARENA_PYTHON: python
        run: >-
          node cli/scripts/consumer-install-smoke.cjs
          --package-spec "@whitegodkingsley/arena-cli@${{ inputs.version }}"
          --expected-version "${{ inputs.version }}"
          --expected-python "${{ matrix.python-version }}"
          --setup
          --timeout-ms 1800000
          --evidence "${{ runner.temp }}/arena-registry-evidence.json"

      - name: Retain registry installation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-evidence-${{ matrix.os }}-node-${{ matrix.node-version }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/arena-registry-evidence.json
          if-no-files-found: error
          retention-days: 30
