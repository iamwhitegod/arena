services:
  arena:
    build:
      context: .
      dockerfile: Dockerfile
    image: arena:local
    volumes:
      - type: bind
        source: ${ARENA_WORKSPACE:-.}
        target: /workspace
      - type: volume
        source: arena-data
        target: /home/node/.arena
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 10s
    stdin_open: true
    tty: true

volumes:
  arena-data:
